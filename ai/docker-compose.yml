version: '3.8'

services:
  hlthy-coach:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    volumes:
      # Mount volumes for persistent data
      - ./user_profiles:/app/user_profiles
      - ./memory_data:/app/memory_data
      # Optional: mount Google Cloud credentials
      # - ~/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust based on needs)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

# Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - hlthy-coach
  #   restart: unless-stopped

volumes:
  user_profiles:
  memory_data:
