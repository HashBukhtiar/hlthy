name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Debug
        run: ls node_modules/.bin/eslint && echo "eslint binary found" || echo "eslint binary MISSING"

      - name: Run ESLint
        run: npm run lint
